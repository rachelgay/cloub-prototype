<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloub — utilisateur</title>
    <link rel="icon" href="./assets/logo-noir.svg" />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>

    <nav class="top-nav">
      <a class="wordmark" href="./index.html"><img src="./assets/logo-blanc.svg" alt="Cloub" /></a>
      <span class="nav-badge">Utilisateur</span>
    </nav>

    <div class="app">

      <header class="page-banner banner-user">
        <img class="banner-sticker" src="./assets/stickers/run.png" alt="" />
        <div class="bubbles"><span class="bubble">Espace collaborateur</span></div>
        <h1>Salut, on bouge ?</h1>
        <p>Inscris-toi aux cours, organise des activités et suis les events qui font bouger ton entreprise.</p>
      </header>

      <nav class="tabs" role="tablist" aria-label="Navigation principale">
        <button class="tab active" data-tab="cours" role="tab" aria-selected="true">Cours</button>
        <button class="tab" data-tab="chat" role="tab" aria-selected="false">Chat</button>
        <button class="tab" data-tab="events" role="tab" aria-selected="false">Events</button>
      </nav>

      <main>

        <!-- COURS -->
        <section id="cours" class="panel active" role="tabpanel">
          <article class="card">
            <h2>S'inscrire à un cours</h2>
            <form id="participant-form">
              <label>
                Nom du participant
                <input type="text" id="participant-name" placeholder="Emma D." required />
              </label>
              <label>
                Sélectionner un cours
                <select id="participant-course" required></select>
              </label>
              <button type="submit">Confirmer l'inscription</button>
            </form>
          </article>

          <article class="card">
            <h2>Cours disponibles</h2>
            <ul id="course-list" class="list"></ul>
          </article>
        </section>

        <!-- CHAT -->
        <section id="chat" class="panel" role="tabpanel">
          <article class="card">
            <h2><span id="chat-title">Chat running</span></h2>
            <div class="channel-switch" role="tablist" aria-label="Canaux du chat">
              <button type="button" class="channel active" data-channel="running">Running</button>
              <button type="button" class="channel" data-channel="natation">Natation</button>
            </div>
            <div id="chat-messages" class="chat-box"></div>
            <form id="chat-form" class="chat-form">
              <label>
                Prénom
                <input type="text" id="chat-author" placeholder="Emma" required />
              </label>
              <label>
                Message
                <input type="text" id="chat-input" placeholder="Run mardi 12h ?" required />
              </label>
              <button type="submit">Envoyer</button>
            </form>
          </article>
        </section>

        <!-- EVENTS -->
        <section id="events" class="panel" role="tabpanel">

          <!-- Planning d'abord -->
          <article class="card">
            <h2>Planning des events</h2>
            <ul id="event-list" class="list"></ul>
          </article>

          <!-- Puis le formulaire -->
          <article class="card">
            <h2>Proposer un event</h2>
            <form id="event-form">
              <label>
                Titre
                <input type="text" id="event-title" placeholder="Sierre-Zinal" required />
              </label>
              <label>
                Type
                <select id="event-type" required>
                  <option value="">Choisir un type...</option>
                  <option value="Cloub Moments">Cloub Moments (événement d'équipe)</option>
                  <option value="Cloub Challenge">Cloub Challenge (objectif course)</option>
                </select>
              </label>
              <label>
                Lieu
                <input type="text" id="event-location" placeholder="Parc de la Planta" required />
              </label>
              <label>
                Date
                <input type="date" id="event-date" required />
              </label>
              <button type="submit">Proposer l'event</button>
            </form>
          </article>

        </section>

      </main>
    </div>

    <script src="./script.js?v=4"></script>
  </body>
</html>
